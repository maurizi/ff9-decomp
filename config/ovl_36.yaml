name: ovl_36
sha1: f7c1f1d54bf67d1ea152d684595dcc6d77dcaec0
options:
  basename: ovl_36
  target_path: disks/us/ovl/36.bin
  base_path: ..
  platform: psx
  compiler: GCC

  asm_path: asm/us/ovl_36
  src_path: src/ovl_36
  build_path: build/us
  ld_script_path: build/us/ovl_36.ld
  ld_dependencies: yes
  elf_path: build/us/ovl_36.elf

  symbol_addrs_path:
    - config/symbols.us.txt
    - config/symbols.psyq.us.txt
    - config/symbols.ovl_36.us.txt
  undefined_funcs_auto_path: config/undefined_funcs_auto.ovl_36.us.txt
  undefined_syms_auto_path: config/undefined_syms_auto.ovl_36.us.txt

  find_file_boundaries: yes
  use_legacy_include_asm: no
  migrate_rodata_to_functions: yes
  section_order: [".rodata", ".text", ".data", ".bss"]
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  asm_jtbl_label_macro: jlabel
  ld_bss_is_noload: false
  subalign: 4
  ld_align_section_vram_end: false
  ld_align_segment_vram_end: false

segments:
  - name: ovl_36
    type: code
    start: 0x0
    vram: 0x801EDF00
    bss_size: 0x0
    subsegments:
      - [0x0, rodata]   # overlay header word (overlay id), an object of its own
      - [0x4, .rodata, ovl_36]
      - [0x29F4, c, ovl_36]
      - [0x51D4, data]

  - [0x7000]
